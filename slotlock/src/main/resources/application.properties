spring.application.name=slotlock

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/slotlock_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000 
jwt.refresh-expiration=604800000

# OTP Configuration
slotlock.otp.expiration-minutes=15
slotlock.otp.max-attempts=5

SENDGRID_API_KEY=${SENDGRID_API_KEY}
SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:slotlockteam.official@gmail.com}

logging.level.org.springframework.security=TRACE